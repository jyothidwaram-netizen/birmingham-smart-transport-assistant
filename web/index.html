
<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>
Birmingham Smart Transport Assistant
</title>

<style>

* {
    box-sizing: border-box;
}

body {

    margin: 0;

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Arial,
        sans-serif;

    background:
        linear-gradient(
            135deg,
            #eef4ff 0%,
            #f8fbff 50%,
            #eef7f3 100%
        );

    min-height: 100vh;

    color: #172033;
}

.app {

    width: 100%;
    max-width: 1100px;

    margin: 0 auto;

    min-height: 100vh;

    display: flex;
    flex-direction: column;
}

.header {

    padding: 24px 20px 14px;

    display: flex;

    justify-content: space-between;

    align-items: center;

    gap: 15px;
}

.brand {

    display: flex;

    align-items: center;

    gap: 12px;
}

.logo {

    width: 50px;
    height: 50px;

    border-radius: 15px;

    display: flex;

    align-items: center;
    justify-content: center;

    background: #172033;

    font-size: 26px;
}

.title {

    font-size: 22px;
    font-weight: 750;
}

.subtitle {

    color: #697386;
    font-size: 13px;

    margin-top: 3px;
}

.status {

    display: flex;

    align-items: center;

    gap: 7px;

    background: white;

    padding: 9px 13px;

    border-radius: 999px;

    font-size: 12px;

    box-shadow:
        0 5px 20px rgba(0,0,0,0.06);
}

.status-dot {

    width: 8px;
    height: 8px;

    border-radius: 50%;

    background: #16a34a;
}

.chat {

    flex: 1;

    padding: 20px;

    display: flex;
    flex-direction: column;

    gap: 15px;
}

.welcome {

    background: white;

    border-radius: 22px;

    padding: 28px;

    box-shadow:
        0 12px 35px rgba(23,32,51,0.08);
}

.welcome h1 {

    margin: 0 0 8px;

    font-size: 30px;
}

.welcome p {

    color: #697386;

    line-height: 1.6;

    margin: 0;
}

.examples {

    display: flex;

    flex-wrap: wrap;

    gap: 8px;

    margin-top: 20px;
}

.example {

    border: 1px solid #e2e7ef;

    background: #f8fafc;

    border-radius: 999px;

    padding: 9px 13px;

    cursor: pointer;

    font-size: 12px;
}

.example:hover {

    background: #eef3fa;
}

.messages {

    display: flex;

    flex-direction: column;

    gap: 14px;
}

.message {

    max-width: 85%;

    padding: 15px 17px;

    border-radius: 18px;

    line-height: 1.55;

    white-space: pre-wrap;
}

.user {

    align-self: flex-end;

    background: #172033;

    color: white;

    border-bottom-right-radius: 5px;
}

.assistant {

    align-self: flex-start;

    background: white;

    box-shadow:
        0 8px 25px rgba(23,32,51,0.07);

    border-bottom-left-radius: 5px;
}

.journey-card {

    margin-top: 13px;

    border: 1px solid #e4e9f0;

    border-radius: 16px;

    padding: 15px;

    background: #fbfcfe;
}

.route {

    font-size: 20px;

    font-weight: 750;

    margin-bottom: 10px;
}

.grid {

    display: grid;

    grid-template-columns:
        repeat(2, minmax(0,1fr));

    gap: 10px;
}

.metric {

    background: white;

    border-radius: 12px;

    padding: 11px;

    border: 1px solid #edf0f5;
}

.metric-label {

    font-size: 11px;

    color: #7b8495;

    margin-bottom: 4px;
}

.metric-value {

    font-size: 14px;

    font-weight: 650;
}

.composer {

    position: sticky;

    bottom: 0;

    padding: 14px 20px 22px;

    background:
        linear-gradient(
            transparent,
            rgba(248,251,255,0.98) 25%
        );
}

.input-box {

    background: white;

    border: 1px solid #dfe5ed;

    border-radius: 18px;

    padding: 8px;

    display: flex;

    align-items: flex-end;

    gap: 8px;

    box-shadow:
        0 12px 35px rgba(23,32,51,0.10);
}

textarea {

    flex: 1;

    resize: none;

    border: none;

    outline: none;

    padding: 12px;

    font-size: 15px;

    min-height: 45px;

    max-height: 130px;

    font-family: inherit;
}

button.send {

    border: none;

    background: #172033;

    color: white;

    width: 46px;

    height: 46px;

    border-radius: 14px;

    cursor: pointer;

    font-size: 18px;
}

button.send:disabled {

    opacity: 0.5;

    cursor: wait;
}

.loading {

    display: inline-flex;

    gap: 5px;

    align-items: center;
}

.dot {

    width: 6px;
    height: 6px;

    background: #8993a5;

    border-radius: 50%;

    animation: blink 1s infinite;
}

.dot:nth-child(2) {
    animation-delay: .15s;
}

.dot:nth-child(3) {
    animation-delay: .3s;
}

@keyframes blink {

    0%,100% {
        opacity: .25;
    }

    50% {
        opacity: 1;
    }
}

.footer {

    text-align: center;

    color: #8b94a5;

    font-size: 11px;

    padding-top: 5px;
}

@media (max-width: 650px) {

    .header {

        padding: 16px 14px 10px;
    }

    .title {
        font-size: 18px;
    }

    .subtitle {
        font-size: 11px;
    }

    .status {
        display: none;
    }

    .chat {
        padding: 14px;
    }

    .welcome {
        padding: 20px;
        border-radius: 18px;
    }

    .welcome h1 {
        font-size: 24px;
    }

    .message {
        max-width: 94%;
    }

    .grid {
        grid-template-columns: 1fr;
    }

    .composer {
        padding: 10px 14px 15px;
    }
}

</style>

</head>

<body>

<div class="app">

    <header class="header">

        <div class="brand">

            <div class="logo">
                🚌
            </div>

            <div>

                <div class="title">
                    Birmingham Smart Transport
                </div>

                <div class="subtitle">
                    Live journey & ETA assistant
                </div>

            </div>

        </div>

        <div class="status">

            <span class="status-dot"></span>

            Live transport system

        </div>

    </header>


    <main class="chat">

        <section class="welcome">

            <h1>
                Where are you going?
            </h1>

            <p>
                Ask me for your next suitable bus,
                live boarding time, destination ETA,
                delay and confidence.
            </p>

            <div class="examples">

                <button
                    class="example"
                    onclick="useExample('What is my next bus from Coronation Gardens to Colmore Row?')"
                >
                    Coronation Gardens → Colmore Row
                </button>

                <button
                    class="example"
                    onclick="useExample('Next bus from Colmore Row to Coronation Gardens')"
                >
                    Colmore Row → Coronation Gardens
                </button>

                <button
                    class="example"
                    onclick="useExample('Plan a journey from Coronation Gardens to Colmore Row')"
                >
                    Plan a journey
                </button>

            </div>

        </section>


        <section
            id="messages"
            class="messages"
        ></section>

    </main>


    <div class="composer">

        <div class="input-box">

            <textarea
                id="message"
                placeholder="Ask: What is my next bus from A to B?"
                rows="1"
                onkeydown="handleKey(event)"
            ></textarea>

            <button
                id="send"
                class="send"
                onclick="sendMessage()"
            >
                ➤
            </button>

        </div>

        <div class="footer">

            Live data • ML ETA • Exact trip verification

        </div>

    </div>

</div>


<script>

const messageBox =
    document.getElementById("message");

const sendButton =
    document.getElementById("send");

const messages =
    document.getElementById("messages");


function useExample(text) {

    messageBox.value = text;

    messageBox.focus();

    sendMessage();
}


function handleKey(event) {

    if (
        event.key === "Enter" &&
        !event.shiftKey
    ) {

        event.preventDefault();

        sendMessage();
    }
}


function addMessage(
    text,
    type,
    data = null
) {

    const div =
        document.createElement("div");

    div.className =
        "message " + type;

    div.textContent = text;

    if (
        type === "assistant" &&
        data &&
        data.type === "journey" &&
        data.best
    ) {

        const best = data.best;

        const card =
            document.createElement("div");

        card.className =
            "journey-card";

        const route =
            document.createElement("div");

        route.className = "route";

        route.textContent =
            "🚌 Route " +
            (best.route || "—");

        card.appendChild(route);

        const grid =
            document.createElement("div");

        grid.className = "grid";

        const metrics = [

            [
                "📍 Current location",
                best.current_location
            ],

            [
                "🚏 Next stop",
                best.next_stop_name
            ],

            [
                "⏱️ Boarding",
                best.boarding_time
            ],

            [
                "⌛ Wait",
                best.eta_to_origin_min != null
                    ? Number(
                        best.eta_to_origin_min
                    ).toFixed(1) + " min"
                    : "—"
            ],

            [
                "🏁 Destination",
                best.destination_time
            ],

            [
                "🕒 Journey",
                best.eta_to_destination_min != null
                    && best.eta_to_origin_min != null
                    ? (
                        Number(
                            best.eta_to_destination_min
                        ) -
                        Number(
                            best.eta_to_origin_min
                        )
                    ).toFixed(1) + " min"
                    : "—"
            ],

            [
                "⚠️ Delay",
                best.delay_min != null &&
                !Number.isNaN(
                    Number(best.delay_min)
                )
                    ? Number(
                        best.delay_min
                    ).toFixed(1) + " min"
                    : "—"
            ],

            [
                "🎯 Confidence",
                best.confidence || "—"
            ]

        ];

        metrics.forEach(item => {

            const metric =
                document.createElement("div");

            metric.className =
                "metric";

            const label =
                document.createElement("div");

            label.className =
                "metric-label";

            label.textContent =
                item[0];

            const value =
                document.createElement("div");

            value.className =
                "metric-value";

            value.textContent =
                item[1] == null
                    ? "—"
                    : String(item[1]);

            metric.appendChild(label);
            metric.appendChild(value);

            grid.appendChild(metric);
        });

        card.appendChild(grid);

        div.appendChild(card);
    }

    messages.appendChild(div);

    window.scrollTo({
        top: document.body.scrollHeight,
        behavior: "smooth"
    });
}


function addLoading() {

    const div =
        document.createElement("div");

    div.className =
        "message assistant";

    div.id = "loading";

    div.innerHTML = `
        <span class="loading">
            Checking live buses
            <span class="dot"></span>
            <span class="dot"></span>
            <span class="dot"></span>
        </span>
    `;

    messages.appendChild(div);

    window.scrollTo({
        top: document.body.scrollHeight,
        behavior: "smooth"
    });
}


function removeLoading() {

    const loading =
        document.getElementById("loading");

    if (loading) {
        loading.remove();
    }
}


async function sendMessage() {

    const text =
        messageBox.value.trim();

    if (!text) {
        return;
    }

    addMessage(
        text,
        "user"
    );

    messageBox.value = "";

    sendButton.disabled = true;

    addLoading();

    try {

        const response =
            await fetch(
                "/chat",
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body: JSON.stringify({
                        message: text
                    })
                }
            );

        const data =
            await response.json();

        removeLoading();

        addMessage(
            data.answer ||
            "I could not process that request.",
            "assistant",
            data
        );

    }
    catch(error) {

        removeLoading();

        addMessage(
            "❌ I could not connect to the transport service. Please try again.",
            "assistant"
        );

        console.error(error);
    }

    sendButton.disabled = false;

    messageBox.focus();
}

</script>

</body>

</html>
